name: Nightly Windows Build

on:
  schedule:
    # Every day at 00:00 Asia/Shanghai.
    - cron: '0 0 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if there were no commits in the last 24 hours'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows package
    # Optional repository variable WINDOWS_RUNNER overrides the default label
    # (use one label, e.g. windows or self-hosted). For multiple labels,
    # replace this line with a YAML array such as:
    # runs-on: [self-hosted, windows]
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for recent commits
        id: changes
        shell: powershell
        run: |
          $force = "${{ github.event.inputs.force }}"
          $commits = @(git log --since="24 hours ago" --pretty=format:"%h %s" 2>$null)
          if ($force -eq "true" -or $commits.Count -gt 0) {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_changes=true" -Encoding ASCII
            Add-Content -Path $env:GITHUB_OUTPUT -Value "commit_count=$($commits.Count)" -Encoding ASCII
            Write-Host "Found $($commits.Count) commit(s) in the last 24 hours."
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "has_changes=false" -Encoding ASCII
            Write-Host "No commits in the last 24 hours; build and release will be skipped."
          }

      - name: No recent commits
        if: steps.changes.outputs.has_changes != 'true'
        shell: powershell
        run: Write-Host "No commits in the last 24 hours. Skipping build and release."

      - name: Install Rust
        if: steps.changes.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release
        if: steps.changes.outputs.has_changes == 'true'
        shell: powershell
        run: |
          $env:RUST_BACKTRACE = "1"
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        id: package
        if: steps.changes.outputs.has_changes == 'true'
        shell: powershell
        run: |
          $tag = "nightly-" + (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmmss")
          $zip = "YKExplorer-windows-x64-$tag.zip"
          $pkg = "package"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "target/release/YKExplorer.exe" (Join-Path $pkg "YKExplorer.exe")
          Copy-Item "README.md" $pkg
          Copy-Item "LICENSE" $pkg
          @(
            "YKExplorer nightly Windows build"
            "Commit: $env:GITHUB_SHA"
            "Built (UTC): $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss'))"
          ) | Set-Content -Path (Join-Path $pkg "BUILD.txt") -Encoding UTF8
          Compress-Archive -Path (Join-Path $pkg "*") -DestinationPath $zip -Force
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag" -Encoding ASCII
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip" -Encoding ASCII
          Write-Host "Created $zip"

      - name: Publish release
        if: steps.changes.outputs.has_changes == 'true'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw "GITHUB_TOKEN is empty. Enable Actions write permissions for this repository."
          }

          $api = $env:GITHUB_API_URL
          if ([string]::IsNullOrWhiteSpace($api)) {
            if ([string]::IsNullOrWhiteSpace($env:GITHUB_SERVER_URL)) {
              throw "Neither GITHUB_API_URL nor GITHUB_SERVER_URL is set."
            }
            $api = "$($env:GITHUB_SERVER_URL.TrimEnd('/'))/api/v1"
          }
          $api = $api.TrimEnd('/')
          $repo = $env:GITHUB_REPOSITORY
          $tag = "${{ steps.package.outputs.tag }}"
          $zip = "${{ steps.package.outputs.zip }}"

          $changes = @(git log --since="24 hours ago" --pretty=format:"- %h %s" 2>$null) -join "`n"
          if ([string]::IsNullOrWhiteSpace($changes)) {
            $changes = "- Manual build (no commits in the last 24 hours)"
          }

          $body = @"
          Nightly Windows build from master.

          Commit: $env:GITHUB_SHA
          Changes in the last 24 hours:
          $changes
          "@

          $payload = @{
            tag_name         = $tag
            name             = "Nightly $tag"
            body             = $body
            target_commitish = $env:GITHUB_SHA
            draft            = $false
            prerelease       = $true
          } | ConvertTo-Json -Depth 5

          $headers = @{
            Authorization = "token $env:GITHUB_TOKEN"
            Accept        = "application/json"
          }
          $release = Invoke-RestMethod -Uri "$api/repos/$repo/releases" -Method Post -Headers $headers -ContentType "application/json" -Body $payload
          Write-Host "Created release $($release.id) ($tag)"

          $upload = "$api/repos/$repo/releases/$($release.id)/assets?name=$zip"
          & curl.exe -f -sS -X POST -H "Authorization: token $env:GITHUB_TOKEN" -F "attachment=@$zip" $upload
          if ($LASTEXITCODE -ne 0) {
            throw "Asset upload failed with exit code $LASTEXITCODE"
          }
          Write-Host "Uploaded $zip"
