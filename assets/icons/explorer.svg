<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63ACFF"/>
      <stop offset="1" stop-color="#2C77F0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9F2FE"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#tile)"/>

  <!-- Folder: tab behind the body -->
  <rect x="44" y="82" width="112" height="34" rx="14" fill="url(#paper)"/>
  <rect x="44" y="98" width="168" height="108" rx="18" fill="url(#paper)"/>

  <!-- Header strip -->
  <rect x="52" y="128" width="152" height="11" rx="5.5" fill="#2F7CF6" opacity="0.13"/>

  <!-- Rows -->
  <g fill="#2F7CF6">
    <rect x="74" y="148" width="12" height="12" rx="3.5" opacity="0.42"/>
    <rect x="96" y="150" width="78" height="8" rx="4" opacity="0.9"/>

    <rect x="74" y="169" width="12" height="12" rx="3.5" opacity="0.42"/>
    <rect x="96" y="171" width="56" height="8" rx="4" opacity="0.9"/>

    <rect x="74" y="190" width="12" height="12" rx="3.5" opacity="0.42"/>
    <rect x="96" y="192" width="68" height="8" rx="4" opacity="0.9"/>
  </g>
</svg>
