[package]
name = "fpilot"
version = "0.1.0"
edition = "2024"
description = "A modern Windows file manager built with GPUI and Rust"
license = "MIT"

[[bin]]
name = "fpilot"
path = "src/main.rs"

[build-dependencies]
resvg = "0.45"
usvg = "0.45"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
dunce = "1"
env_logger = "0.11"
raw-window-handle = "0.6"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
unicode-segmentation = "1"
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
    "Win32_System_Com_Marshal",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Environment",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
opt-level = 2
strip = true
lto = "thin"

[profile.dev.package.fpilot]
debug = 1


[patch.crates-io]
gpui = { path = "vendor/gpui" }
